<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lumi — seu amigo virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1622;
    --amber:#ff9d5c;
    --amber-soft:#ffcf9e;
    --teal:#6bc7b8;
    --ink:#f2ece1;
    --muted:#6f8394;
    --panel:rgba(13,24,36,0.55);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:var(--bg); overflow:hidden;
    font-family:'Inter',sans-serif; color:var(--ink); }
  #scene{ position:fixed; inset:0; display:block; touch-action:none; }
  .vignette{ position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 38%, rgba(5,10,16,0.8) 100%); }
  .ui{ position:fixed; inset:0; display:flex; flex-direction:column; justify-content:space-between;
    padding:max(22px, env(safe-area-inset-top)) 20px max(22px, env(safe-area-inset-bottom));
    pointer-events:none; }

  .hud{ display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; }
  .companion-name{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:21px;
    letter-spacing:0.02em; display:flex; align-items:center; gap:8px; }
  .ember-dot{ width:8px; height:8px; border-radius:50%; background:var(--amber);
    box-shadow:0 0 10px 2px var(--amber); }
  .status{ font-size:12.5px; color:var(--muted); letter-spacing:0.05em;
    min-height:16px; transition:color .3s ease; }
  .status.listening{ color:var(--teal); }
  .status.speaking{ color:var(--amber-soft); }

  .caption{ align-self:center; max-width:520px; text-align:center; font-size:16.5px; line-height:1.5;
    color:var(--ink); background:rgba(6,12,18,0.78); backdrop-filter:blur(8px);
    border-radius:16px; padding:10px 18px; margin:0 16px;
    box-shadow:0 6px 24px rgba(0,0,0,0.3);
    opacity:0; transition:opacity .45s ease; }
  .caption.show{ opacity:1; }

  .controls{ display:flex; align-items:center; justify-content:center; gap:24px; pointer-events:auto; }
  .icon-btn{ width:44px; height:44px; border-radius:50%; border:1px solid rgba(242,236,225,0.15);
    background:var(--panel); color:var(--muted); display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); }
  .mic-btn{ width:74px; height:74px; border-radius:50%; border:none;
    background:linear-gradient(145deg,var(--amber),#e2793a); color:#20120a;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 0 rgba(255,157,92,0.5);
    transition:box-shadow .4s ease, transform .15s ease, background .3s ease; }
  .mic-btn:active{ transform:scale(0.94); }
  .mic-btn.listening{ background:linear-gradient(145deg,var(--teal),#3f9384);
    box-shadow:0 0 0 14px rgba(107,199,184,0.14); }
  .mic-btn.speaking{ background:linear-gradient(145deg,var(--amber-soft),var(--amber)); }

  .text-form{ pointer-events:auto; display:flex; gap:8px; margin-top:14px; }
  .text-form input{ flex:1; background:var(--panel); border:1px solid rgba(242,236,225,0.15);
    border-radius:20px; padding:11px 16px; color:var(--ink); font-family:'Inter'; font-size:15px; }
  .text-form input::placeholder{ color:var(--muted); }
  .text-form button{ background:var(--amber); border:none; border-radius:20px; padding:10px 18px;
    font-family:'Inter'; font-weight:600; color:#20120a; }

  .hint{ text-align:center; font-size:11px; color:var(--muted); margin:8px 0 0; min-height:14px; }

  .credits-badge{ margin-top:2px; font-size:11.5px; color:var(--amber-soft); background:rgba(255,157,92,0.12);
    border:1px solid rgba(255,157,92,0.3); border-radius:12px; padding:3px 10px; cursor:pointer;
    pointer-events:auto; display:inline-block; }

  .overlay-panel{ position:fixed; inset:0; background:rgba(5,10,16,0.82); display:flex; align-items:center;
    justify-content:center; z-index:20; pointer-events:auto; padding:20px; }
  .panel-inner{ background:#101c28; border:1px solid rgba(242,236,225,0.12); border-radius:20px;
    padding:24px 20px; max-width:340px; width:100%; text-align:center; }
  .panel-inner h3{ font-family:'Quicksand',sans-serif; margin:0 0 16px; font-size:18px; }
  .pack-btn{ display:block; width:100%; margin-bottom:10px; padding:12px; border-radius:14px;
    border:1px solid rgba(255,157,92,0.35); background:rgba(255,157,92,0.1); color:var(--ink);
    font-family:'Inter'; font-size:14.5px; }
  #payerForm input{ display:block; width:100%; margin-bottom:10px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(242,236,225,0.15); border-radius:12px; padding:10px 14px; color:var(--ink);
    font-family:'Inter'; font-size:14px; }
  #payerForm button, #copyPixBtn{ width:100%; padding:11px; border-radius:12px; border:none;
    background:var(--amber); color:#20120a; font-weight:600; font-family:'Inter'; margin-top:4px; }
  #pixQr{ width:170px; height:170px; margin:8px auto; display:block; border-radius:12px; background:#fff; padding:6px; }
  #pixCode{ width:100%; height:56px; font-size:11px; background:rgba(255,255,255,0.05); color:var(--muted);
    border:1px solid rgba(242,236,225,0.12); border-radius:10px; padding:8px; margin-bottom:8px; resize:none; }
  #pixStatus{ font-size:12.5px; color:var(--muted); margin:10px 0 0; }
  .close-btn{ margin-top:14px; background:none; border:none; color:var(--muted); font-size:13px;
    text-decoration:underline; }

  button:focus-visible, input:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<div class="ui">
  <header class="hud">
    <div class="companion-name"><span class="ember-dot"></span>Lumi</div>
    <div class="status" id="status">toque para conversar</div>
    <div class="credits-badge" id="creditsBadge">— créditos</div>
  </header>

  <div class="caption" id="caption" aria-live="polite"></div>

  <div>
    <div class="controls">
      <button class="icon-btn" id="keyboardBtn" aria-label="Digitar mensagem" title="Digitar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="6" width="18" height="12" rx="2.5"/>
          <path d="M7 10h.01M11 10h.01M15 10h.01M17 10h.01M7 14h6" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="mic-btn" id="micBtn" aria-label="Falar com Lumi">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v4M9 22h6" stroke-linecap="round"/>
        </svg>
      </button>
      <div style="width:44px"></div>
    </div>

    <form class="text-form" id="textForm" hidden>
      <input id="textInput" type="text" placeholder="Escreva algo para a Lumi..." autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>

    <p class="hint" id="hint"></p>
  </div>
</div>

<div class="overlay-panel" id="buyPanel" hidden>
  <div class="panel-inner">
    <h3>Comprar créditos</h3>
    <div id="packStep">
      <button class="pack-btn" data-pack="small">R$5 — 50 mensagens</button>
      <button class="pack-btn" data-pack="medium">R$10 — 120 mensagens</button>
    </div>
    <form id="payerForm" hidden>
      <input id="payerName" placeholder="Nome completo" autocomplete="name" />
      <input id="payerEmail" placeholder="E-mail" type="email" autocomplete="email" />
      <input id="payerCpf" placeholder="CPF (só números)" inputmode="numeric" />
      <button type="submit">Gerar Pix</button>
    </form>
    <div id="pixStep" hidden>
      <img id="pixQr" alt="QR Code Pix" />
      <textarea id="pixCode" readonly></textarea>
      <button id="copyPixBtn" type="button">Copiar código Pix</button>
      <p id="pixStatus">Aguardando pagamento...</p>
    </div>
    <button id="closeBuyBtn" class="close-btn" type="button">Fechar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Three.js scene ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1622);
scene.fog = new THREE.FogExp2(0x0b1622, 0.06);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 6);

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

scene.add(new THREE.AmbientLight(0x2a3a4a, 1.2));
const keyLight = new THREE.PointLight(0xffb377, 2.2, 20);
keyLight.position.set(2, 2, 4);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x6bc7b8, 1.0, 20);
rimLight.position.set(-3, -1, -3);
scene.add(rimLight);

const amberColor = new THREE.Color(0xff9d5c);
const tealColor = new THREE.Color(0x6bc7b8);

// orb body
const geo = new THREE.IcosahedronGeometry(1.15, 3);
const basePositions = geo.attributes.position.array.slice();
const mat = new THREE.MeshStandardMaterial({
  color: amberColor.clone(), emissive: amberColor.clone(),
  emissiveIntensity: 0.5, roughness: 0.35, metalness: 0.1
});
const orb = new THREE.Mesh(geo, mat);
scene.add(orb);

// inner glow core
const core = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.68, 2),
  new THREE.MeshBasicMaterial({ color:0xffe3c2, transparent:true, opacity:0.35 })
);
orb.add(core);

// eyes
const eyeGeo = new THREE.SphereGeometry(0.09, 16, 16);
const eyeMat = new THREE.MeshBasicMaterial({ color:0x1a1210 });
const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.32, 0.12, 1.02);
const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.32, 0.12, 1.02);
orb.add(eyeL, eyeR);

// fireflies
const fireflyCount = 70;
const fPos = new Float32Array(fireflyCount * 3);
const fData = [];
for(let i=0;i<fireflyCount;i++){
  const r = 1.8 + Math.random()*1.8;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos((Math.random()*2)-1);
  fPos[i*3] = r*Math.sin(phi)*Math.cos(theta);
  fPos[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
  fPos[i*3+2] = r*Math.cos(phi);
  fData.push({ r, theta, phi, speed:0.05+Math.random()*0.1, bob:Math.random()*Math.PI*2 });
}
const fGeo = new THREE.BufferGeometry();
fGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
const fireflies = new THREE.Points(fGeo, new THREE.PointsMaterial({
  color:0xffcf9e, size:0.045, transparent:true, opacity:0.85,
  blending:THREE.AdditiveBlending, depthWrite:false
}));
scene.add(fireflies);

/* ---------- pointer parallax ---------- */
let pointer = { x:0, y:0 };
addEventListener('pointermove', e=>{
  pointer.x = (e.clientX/innerWidth - 0.5)*2;
  pointer.y = (e.clientY/innerHeight - 0.5)*2;
});

/* ---------- state machine ---------- */
let state = 'idle';
let energy = 0.03, targetEnergy = 0.03, pulseBoost = 0;
let targetEmissive = 0.5, targetColor = amberColor;
let blinking = false, blinkStart = 0, blinkTimer = 0, nextBlinkAt = 2 + Math.random()*3;

function setState(s){
  state = s;
  const statusEl = document.getElementById('status');
  const micBtn = document.getElementById('micBtn');
  micBtn.classList.remove('listening','speaking');
  statusEl.classList.remove('listening','speaking');
  if(s === 'idle'){
    statusEl.textContent = 'toque para conversar';
    targetEnergy = 0.03; targetEmissive = 0.5; targetColor = amberColor;
  } else if(s === 'listening'){
    statusEl.textContent = 'ouvindo...';
    statusEl.classList.add('listening'); micBtn.classList.add('listening');
    targetEnergy = 0.05; targetEmissive = 0.7; targetColor = tealColor;
  } else if(s === 'thinking'){
    statusEl.textContent = 'pensando...';
    targetEnergy = 0.035; targetEmissive = 0.55; targetColor = tealColor;
  } else if(s === 'speaking'){
    statusEl.textContent = 'falando...';
    statusEl.classList.add('speaking'); micBtn.classList.add('speaking');
    targetEnergy = 0.07; targetEmissive = 0.85; targetColor = amberColor;
  }
}
setState('idle');

function updateOrbGeometry(t, amp){
  const posAttr = orb.geometry.attributes.position;
  const arr = posAttr.array;
  for(let i=0;i<arr.length;i+=3){
    const ox=basePositions[i], oy=basePositions[i+1], oz=basePositions[i+2];
    const len = Math.sqrt(ox*ox+oy*oy+oz*oz) || 1;
    const nx=ox/len, ny=oy/len, nz=oz/len;
    const n = Math.sin(ox*1.6+t*1.1) * Math.cos(oy*1.4+t*0.9) * Math.sin(oz*1.8+t*0.7);
    const d = amp*n;
    arr[i] = ox + nx*d; arr[i+1] = oy + ny*d; arr[i+2] = oz + nz*d;
  }
  posAttr.needsUpdate = true;
  orb.geometry.computeVertexNormals();
}

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  energy += (targetEnergy - energy)*0.04;
  pulseBoost *= 0.9;
  updateOrbGeometry(t, energy + pulseBoost);

  const breathe = 1 + Math.sin(t*0.7)*0.02 + (state==='speaking' ? Math.sin(t*6)*0.015 : 0);
  orb.scale.setScalar(breathe);

  mat.color.lerp(targetColor, 0.03);
  mat.emissive.lerp(targetColor, 0.03);
  mat.emissiveIntensity += (targetEmissive - mat.emissiveIntensity)*0.05;

  eyeL.position.x = -0.32 + pointer.x*0.05;
  eyeR.position.x = 0.32 + pointer.x*0.05;

  blinkTimer += dt;
  if(!blinking && blinkTimer > nextBlinkAt){
    blinking = true; blinkStart = t; blinkTimer = 0; nextBlinkAt = 2.5 + Math.random()*3.5;
  }
  if(blinking){
    const elapsed = t - blinkStart;
    const progress = Math.min(elapsed/0.16, 1);
    const scaleY = 1 - Math.sin(progress*Math.PI)*0.9;
    eyeL.scale.y = scaleY; eyeR.scale.y = scaleY;
    if(elapsed > 0.16) blinking = false;
  }

  const positions = fireflies.geometry.attributes.position.array;
  for(let i=0;i<fireflyCount;i++){
    const d = fData[i];
    d.theta += d.speed*dt*0.3;
    positions[i*3] = d.r*Math.sin(d.phi)*Math.cos(d.theta);
    positions[i*3+1] = d.r*Math.sin(d.phi)*Math.sin(d.theta) + Math.sin(t*0.6+d.bob)*0.15;
    positions[i*3+2] = d.r*Math.cos(d.phi);
  }
  fireflies.geometry.attributes.position.needsUpdate = true;
  fireflies.rotation.y = t*0.02;

  camera.position.x += (pointer.x*0.5 - camera.position.x)*0.03;
  camera.position.y += (-pointer.y*0.35 - camera.position.y)*0.03;
  camera.lookAt(0,0,0);

  renderer.render(scene, camera);
}
animate();

/* ---------- captions / hint ---------- */
function showCaption(text){
  const el = document.getElementById('caption');
  el.textContent = text;
  el.classList.add('show');
}
function setHint(text){ document.getElementById('hint').textContent = text; }

/* ---------- speech recognition (STT) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, isListening = false;

if(SR){
  recognition = new SR();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => { isListening = true; setState('listening'); };
  recognition.onresult = (e) => {
    let interim = '', final = '';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const transcript = e.results[i][0].transcript;
      if(e.results[i].isFinal) final += transcript; else interim += transcript;
      pulseBoost = Math.min(pulseBoost + 0.02, 0.08);
    }
    if(interim) showCaption(interim);
    if(final){
      showCaption(final);
      recognition.stop();
      handleUserMessage(final.trim());
    }
  };
  recognition.onerror = (e) => {
    isListening = false;
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      setHint('Permita o uso do microfone para conversar por voz.');
    }
    if(state === 'listening') setState('idle');
  };
  recognition.onend = () => { isListening = false; if(state === 'listening') setState('idle'); };
}

const inIframe = window.self !== window.top;
if(!SR){
  setHint('Reconhecimento de voz indisponível neste navegador — use o teclado.');
} else if(inIframe){
  setHint('Dentro do Claude o microfone fica bloqueado pelo navegador — use o teclado, a voz de resposta funciona normalmente.');
}

document.getElementById('micBtn').addEventListener('click', () => {
  if(!recognition){
    document.getElementById('textForm').hidden = false;
    document.getElementById('textInput').focus();
    return;
  }
  if(isListening){ recognition.stop(); return; }
  if(state === 'speaking') speechSynthesis.cancel();
  try{ recognition.start(); } catch(err) { /* already running */ }
});

document.getElementById('keyboardBtn').addEventListener('click', () => {
  const form = document.getElementById('textForm');
  form.hidden = !form.hidden;
  if(!form.hidden) document.getElementById('textInput').focus();
});

document.getElementById('textForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('textInput');
  const val = input.value.trim();
  if(!val) return;
  input.value = '';
  showCaption(val);
  handleUserMessage(val);
});

/* ---------- speech synthesis (TTS) ---------- */
let ptVoice = null;
function loadVoice(){
  const voices = speechSynthesis.getVoices();
  ptVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('pt')) || null;
}
if('speechSynthesis' in window){
  loadVoice();
  speechSynthesis.onvoiceschanged = loadVoice;
}

function speak(text){
  showCaption(text);
  if(!('speechSynthesis' in window)){ setState('idle'); return; }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'pt-BR';
  if(ptVoice) utter.voice = ptVoice;
  utter.rate = 1.0;
  utter.pitch = 1.05;
  utter.onstart = () => setState('speaking');
  utter.onboundary = () => { pulseBoost = Math.min(pulseBoost + 0.03, 0.09); };
  utter.onend = () => setState('idle');
  utter.onerror = () => setState('idle');
  speechSynthesis.speak(utter);
}

/* ---------- conversation brain (Claude API) ---------- */
const SYSTEM_PROMPT = `Você é Lumi, um pequeno espírito de luz — um amigo virtual caloroso, curioso e presente. Fale sempre em português do Brasil, em frases curtas e naturais, como numa conversa falada em voz alta. Nunca use markdown, listas, asteriscos ou emojis. Seja acolhedor e com personalidade leve, faça perguntas ocasionais para manter a conversa viva, e mantenha as respostas geralmente entre 1 e 3 frases curtas, a menos que o usuário peça mais detalhes.`;

let history = [];

function getUserId(){
  try{
    let id = localStorage.getItem('lumi_user_id');
    if(!id){
      id = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('lumi_user_id', id);
    }
    return id;
  }catch(e){
    if(!window.__lumiTempId) window.__lumiTempId = 'u_' + Math.random().toString(36).slice(2);
    return window.__lumiTempId;
  }
}
const userId = getUserId();

async function handleUserMessage(text){
  history.push({ role:'user', content:text });
  setState('thinking');
  try{
    let data;
    try{
      data = await callClaude('/.netlify/functions/chat');
    } catch(fnErr){
      if(fnErr.status === 404 && inIframe){
        data = await callClaude('https://api.anthropic.com/v1/messages');
      } else {
        throw fnErr;
      }
    }
    const replyText = (data.content || []).map(b => b.text || '').join('').trim()
      || 'Hmm, não consegui pensar em nada agora.';
    history.push({ role:'assistant', content: replyText });
    speak(replyText);
    refreshCredits();
  } catch(err){
    history.pop();
    console.error('Lumi API error:', err);
    if(err.status === 402){
      speak('Preciso de mais créditos para continuar. Toca ali em cima pra comprar mais.');
      openBuyPanel();
    } else {
      setHint('Não consegui me conectar ao servidor. Erro: ' + (err.message || 'desconhecido'));
      speak('Ops, não consegui falar com o servidor agora. Pode tentar de novo?');
    }
  }
}

async function callClaude(url){
  const payload = {
    model:'claude-sonnet-4-6',
    max_tokens:1000,
    system: SYSTEM_PROMPT,
    messages: history
  };
  if(url.startsWith('/')) payload.userId = userId;
  const res = await fetch(url, {
    method:'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify(payload)
  });
  if(!res.ok){
    const errBody = await res.json().catch(() => ({}));
    const err = new Error(errBody?.error?.message || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return res.json();
}

/* ---------- credits + Pix purchase panel ---------- */
const creditsBadge = document.getElementById('creditsBadge');
const buyPanel = document.getElementById('buyPanel');
let currentCredits = null;
let selectedPack = null;
let pollTimer = null;

async function refreshCredits(){
  try{
    const res = await fetch(`/.netlify/functions/check-credits?userId=${encodeURIComponent(userId)}`);
    const data = await res.json();
    currentCredits = data.credits;
    creditsBadge.textContent = currentCredits + (currentCredits === 1 ? ' crédito' : ' créditos');
  }catch(e){ creditsBadge.textContent = ''; }
}
refreshCredits();

creditsBadge.addEventListener('click', openBuyPanel);
document.getElementById('closeBuyBtn').addEventListener('click', closeBuyPanel);

function openBuyPanel(){ buyPanel.hidden = false; }
function closeBuyPanel(){
  buyPanel.hidden = true;
  clearInterval(pollTimer);
  try{ localStorage.removeItem('lumi_pending_payment'); }catch(e){}
  document.getElementById('packStep').hidden = false;
  document.getElementById('payerForm').hidden = true;
  document.getElementById('pixStep').hidden = true;
  document.getElementById('payerForm').reset();
}

document.querySelectorAll('.pack-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedPack = btn.dataset.pack;
    document.getElementById('packStep').hidden = true;
    document.getElementById('payerForm').hidden = false;
  });
});

document.getElementById('payerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('payerName').value.trim();
  const email = document.getElementById('payerEmail').value.trim();
  const cpf = document.getElementById('payerCpf').value.trim();
  if(!name || !email || !cpf) return;

  document.getElementById('payerForm').hidden = true;
  document.getElementById('pixStep').hidden = false;
  document.getElementById('pixStatus').textContent = 'Gerando Pix...';

  try{
    const res = await fetch('/.netlify/functions/create-payment', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ userId, packId: selectedPack, name, email, cpf })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data?.error?.message || 'Falha ao gerar Pix');

    document.getElementById('pixQr').src = 'data:image/png;base64,' + data.qrCodeBase64;
    document.getElementById('pixCode').value = data.qrCode;
    document.getElementById('pixStatus').textContent = 'Escaneie o QR Code ou copie o código. Aguardando pagamento...';
    try{
      localStorage.setItem('lumi_pending_payment', JSON.stringify({
        paymentId: data.paymentId,
        qrCode: data.qrCode,
        qrCodeBase64: data.qrCodeBase64,
        createdAt: Date.now()
      }));
    }catch(e){}
    pollForCredit(data.paymentId);
  }catch(err){
    document.getElementById('pixStatus').textContent = 'Erro: ' + err.message;
  }
});

document.getElementById('copyPixBtn').addEventListener('click', () => {
  const code = document.getElementById('pixCode');
  code.select();
  navigator.clipboard?.writeText(code.value).catch(()=>{});
});

function pollForCredit(paymentId){
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try{
      const res = await fetch(`/.netlify/functions/check-payment?paymentId=${encodeURIComponent(paymentId)}`);
      const data = await res.json();
      if(!res.ok){
        document.getElementById('pixStatus').textContent = 'Erro ao verificar: ' + (data.error || ('HTTP ' + res.status));
        return;
      }
      if(data.status === 'approved'){
        clearInterval(pollTimer);
        await refreshCredits();
        try{ localStorage.removeItem('lumi_pending_payment'); }catch(e){}
        document.getElementById('pixStatus').textContent = 'Pagamento confirmado! Créditos adicionados.';
        setTimeout(closeBuyPanel, 1800);
      } else if(data.status === 'cancelled' || data.status === 'rejected'){
        clearInterval(pollTimer);
        document.getElementById('pixStatus').textContent = 'Pagamento não concluído (status: ' + data.status + '). Gere um novo Pix.';
      } else {
        document.getElementById('pixStatus').textContent = 'Status: ' + (data.status || 'desconhecido') + ' — verificando de novo...';
      }
    }catch(e){
      document.getElementById('pixStatus').textContent = 'Erro de conexão ao verificar: ' + e.message;
    }
  }, 4000);
}

function restorePendingPayment(){
  try{
    const raw = localStorage.getItem('lumi_pending_payment');
    if(!raw) return;
    const pending = JSON.parse(raw);
    if(Date.now() - pending.createdAt > 30*60*1000){
      localStorage.removeItem('lumi_pending_payment');
      return;
    }
    buyPanel.hidden = false;
    document.getElementById('packStep').hidden = true;
    document.getElementById('payerForm').hidden = true;
    document.getElementById('pixStep').hidden = false;
    document.getElementById('pixQr').src = 'data:image/png;base64,' + pending.qrCodeBase64;
    document.getElementById('pixCode').value = pending.qrCode;
    document.getElementById('pixStatus').textContent = 'Retomando... verificando pagamento.';
    pollForCredit(pending.paymentId);
  }catch(e){}
}
restorePendingPayment();

/* ---------- greeting ---------- */
addEventListener('load', () => {
  setTimeout(() => {
    const greeting = 'Oi! Eu sou a Lumi. Toque no botão e fale comigo, ou digite se preferir.';
    history.push({ role:'assistant', content: greeting });
    speak(greeting);
  }, 900);
});
</script>
